# Инфраструктура разработки: база, NoSQL и почтовый сервер.
# Запуск: docker compose -f deploy/docker-compose.yml up -d
# Приложение и nginx добавляются в Фазе 11 (docs/SPEC.md §16).
name: zeldaarena

services:
  postgres:
    image: postgres:17-alpine
    container_name: zeldaarena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zeldaarena}
      POSTGRES_USER: ${POSTGRES_USER:-zeldaarena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeldaarena_dev}
    # 5432 на хосте часто занят локально установленным PostgreSQL, поэтому наружу — 5433.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zeldaarena} -d ${POSTGRES_DB:-zeldaarena}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:8
    container_name: zeldaarena-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-zeldaarena}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Письма с кодом подтверждения оплаты (docs/SPEC.md §7.6) видны на http://localhost:8025
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: zeldaarena-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

volumes:
  postgres-data:
  mongo-data:
