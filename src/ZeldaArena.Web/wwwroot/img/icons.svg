<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    Спрайт иконок ZeldaArena. Вставляется тег-хелпером <icon name="..." />.

    Шрифты иконок макета непригодны: boxicons.min.css и flaticon.css в выданном
    шаблоне отсутствуют, а без них .woff2 не связать с именами классов
    (docs/design/design-system.md §1, §12). Соответствие имён — там же.

    Все контурные иконки наследуют обводку от группы: цвет берётся из currentColor,
    поэтому иконка красится тем же правилом, что и текст рядом. Логотипы соцсетей
    заливные — контуром они читаются плохо.

    Новая иконка добавляется только вместе с разметкой, которая её просит.
    Имена проверяются тестом IconSpriteTests: опечатка в name иначе видна только глазами.
  -->
  <defs>
    <style>
      symbol { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      symbol.is-filled { fill: currentColor; stroke: none; }
    </style>
  </defs>

  <!-- ── Навигация и управление ─────────────────────────────────────────── -->

  <symbol id="search" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="7" />
    <path d="M20 20l-4.35-4.35" />
  </symbol>

  <symbol id="menu" viewBox="0 0 24 24">
    <path d="M3 6h18M3 12h18M3 18h18" />
  </symbol>

  <symbol id="close" viewBox="0 0 24 24">
    <path d="M6 6l12 12M18 6L6 18" />
  </symbol>

  <symbol id="chevron-down" viewBox="0 0 24 24">
    <path d="M6 9l6 6 6-6" />
  </symbol>

  <symbol id="chevron-left" viewBox="0 0 24 24">
    <path d="M15 6l-6 6 6 6" />
  </symbol>

  <symbol id="chevron-right" viewBox="0 0 24 24">
    <path d="M9 6l6 6-6 6" />
  </symbol>

  <symbol id="arrow-up" viewBox="0 0 24 24">
    <path d="M12 20V4M5 11l7-7 7 7" />
  </symbol>

  <symbol id="external" viewBox="0 0 24 24">
    <path d="M14 4h6v6M20 4l-9 9" />
    <path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" />
  </symbol>

  <!-- ── Аккаунт и магазин ──────────────────────────────────────────────── -->

  <symbol id="user" viewBox="0 0 24 24">
    <circle cx="12" cy="8" r="4" />
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1" />
  </symbol>

  <symbol id="cart" viewBox="0 0 24 24">
    <circle cx="9" cy="20" r="1.5" />
    <circle cx="18" cy="20" r="1.5" />
    <path d="M2 3h3l2.6 12.4a1 1 0 0 0 1 .8h9.1a1 1 0 0 0 1-.77L21 8H6" />
  </symbol>

  <symbol id="bell" viewBox="0 0 24 24">
    <path d="M18 9a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6" />
    <path d="M13.7 20a2 2 0 0 1-3.4 0" />
  </symbol>

  <symbol id="lock" viewBox="0 0 24 24">
    <rect x="4" y="10" width="16" height="11" rx="2" />
    <path d="M8 10V7a4 4 0 0 1 8 0v3" />
  </symbol>

  <symbol id="shield" viewBox="0 0 24 24">
    <path d="M12 3l8 3v6c0 5-3.4 8.3-8 9.8-4.6-1.5-8-4.8-8-9.8V6z" />
    <path d="M9 12l2 2 4-4" />
  </symbol>

  <symbol id="trash" viewBox="0 0 24 24">
    <path d="M4 7h16M10 4h4M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" />
    <path d="M10 11v6M14 11v6" />
  </symbol>

  <symbol id="plus" viewBox="0 0 24 24">
    <path d="M12 5v14M5 12h14" />
  </symbol>

  <symbol id="minus" viewBox="0 0 24 24">
    <path d="M5 12h14" />
  </symbol>

  <!-- ── Киберспорт ─────────────────────────────────────────────────────── -->

  <symbol id="trophy" viewBox="0 0 24 24">
    <path d="M7 4h10v6a5 5 0 0 1-10 0z" />
    <path d="M7 6H4v1a4 4 0 0 0 3 3.9M17 6h3v1a4 4 0 0 1-3 3.9" />
    <path d="M12 15v3M8 21h8M9 21a3 3 0 0 1 3-3 3 3 0 0 1 3 3" />
  </symbol>

  <symbol id="users" viewBox="0 0 24 24">
    <circle cx="9" cy="8" r="3.5" />
    <path d="M2.5 20v-1a5 5 0 0 1 5-5h3a5 5 0 0 1 5 5v1" />
    <path d="M16.5 5.2a3.5 3.5 0 0 1 0 6.6M17.5 14.2a5 5 0 0 1 4 4.8v1" />
  </symbol>

  <symbol id="controller" viewBox="0 0 24 24">
    <path d="M7.5 7h9a5 5 0 0 1 4.9 4l.9 5a2.4 2.4 0 0 1-4.4 1.7L16 15H8l-1.9 2.7A2.4 2.4 0 0 1 1.7 16l.9-5a5 5 0 0 1 4.9-4z" />
    <path d="M6.5 11v3M5 12.5h3M16 11.5h.01M18 13.5h.01" />
  </symbol>

  <symbol id="play" viewBox="0 0 24 24">
    <path d="M8 5.5l10 6.5-10 6.5z" />
  </symbol>

  <symbol id="calendar" viewBox="0 0 24 24">
    <rect x="3" y="5" width="18" height="16" rx="2" />
    <path d="M3 10h18M8 3v4M16 3v4" />
  </symbol>

  <symbol id="clock" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" />
    <path d="M12 7v5l3.5 2" />
  </symbol>

  <symbol id="globe" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" />
    <path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z" />
  </symbol>

  <!-- ── Админка ─────────────────────────────────────────────────────────── -->

  <symbol id="grid" viewBox="0 0 24 24">
    <rect x="4" y="4" width="6.5" height="6.5" rx="1" />
    <rect x="13.5" y="4" width="6.5" height="6.5" rx="1" />
    <rect x="4" y="13.5" width="6.5" height="6.5" rx="1" />
    <rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1" />
  </symbol>

  <!-- ── Обратная связь ─────────────────────────────────────────────────── -->

  <symbol id="check" viewBox="0 0 24 24">
    <path d="M4 12.5l5.5 5.5L20 7" />
  </symbol>

  <symbol id="alert" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" />
    <path d="M12 7.5v5.5M12 16.5h.01" />
  </symbol>

  <!-- ── Соцсети ────────────────────────────────────────────────────────── -->

  <symbol id="facebook" class="is-filled" viewBox="0 0 24 24">
    <path d="M13.5 21v-8h2.7l.4-3.1h-3.1V7.9c0-.9.25-1.5 1.55-1.5h1.65V3.63A22 22 0 0 0 14.3 3.5c-2.4 0-4 1.46-4 4.14V9.9H7.6V13h2.7v8z" />
  </symbol>

  <symbol id="twitter" class="is-filled" viewBox="0 0 24 24">
    <path d="M3 3h4.9l4.5 6.1L17.7 3H21l-6.9 7.9L21.4 21h-4.9l-4.8-6.5L6 21H2.6l7.3-8.3z" />
  </symbol>

  <symbol id="youtube" class="is-filled" viewBox="0 0 24 24">
    <path d="M21.6 7.2a2.5 2.5 0 0 0-1.75-1.77C18.3 5 12 5 12 5s-6.3 0-7.85.43A2.5 2.5 0 0 0 2.4 7.2 26 26 0 0 0 2 12a26 26 0 0 0 .4 4.8 2.5 2.5 0 0 0 1.75 1.77C5.7 19 12 19 12 19s6.3 0 7.85-.43a2.5 2.5 0 0 0 1.75-1.77A26 26 0 0 0 22 12a26 26 0 0 0-.4-4.8M10 15.1V8.9l5.2 3.1z" />
  </symbol>

  <symbol id="twitch" class="is-filled" viewBox="0 0 24 24">
    <path d="M4.3 3 3 6.3v12.2h4.1V21h2.3l2.3-2.5h3.3L20.6 14V3zm14.1 10.2-2.6 2.6h-4.1L9.4 18v-2.2H5.9V4.5h12.5zM13.8 7.5h1.5v4.3h-1.5zm-4.1 0h1.5v4.3H9.7z" />
  </symbol>

  <symbol id="instagram" viewBox="0 0 24 24">
    <rect x="3" y="3" width="18" height="18" rx="5" />
    <circle cx="12" cy="12" r="4" />
    <path d="M17 7h.01" />
  </symbol>
</svg>
